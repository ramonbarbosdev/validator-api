name: ci

on:
  pull_request:
  push:
    branches: [main, develop, "feat/**"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r pack/scripts/requirements-ci.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
