[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validator-api"
version = "0.1.0"
description = "Webhook, fila e runner para validacao de PR com cursor-api-validator-java"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cursor-sdk>=0.1.0",
  "pyyaml>=6.0",
  "tree-sitter>=0.23",
  "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
validator-api = "validator_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
include = [
  "pack/engine/**/*.py",
  "pack/scripts/rules_catalog.py",
  "pack/scripts/run_static_checks.py",
  "pack/scripts/merge_static_findings.py",
  "pack/scripts/backtest.py",
  "tests/**/*.py",
]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["validator_api", "engine", "rules_catalog", "run_static_checks", "merge_static_findings", "report_quality", "backtest", "conftest", "_ci_module"]
