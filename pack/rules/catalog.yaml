# Catalogo de regras: fonte unica para scripts, prompt e gate.
# tipo: estatico (script decide) | semi (script extrai fatos, LLM decide) | semantico (LLM decide)
# status: ativo (padrao quando ausente e ha check) | pendente (check previsto, ainda sem script) | substituida
regras:
  - id: EV-COM-001
    severidade: IMPORTANTE
    tipo: estatico
    aplica_a: ["**/*.java"]
    check: checks/check_comentarios.py
    descricao: Proibido comentario (// ou /* */) em qualquer parte do codigo Java; apenas JavaDoc.
    como_corrigir: Remover o comentario ou migrar a informacao para JavaDoc da declaracao.
    substitui: EV-SVC-003   # a antiga cobria so service/controller/security e so dentro de metodo

  - id: EV-DDL-002
    severidade: IMPORTANTE
    tipo: estatico
    aplica_a: ["**/db/**/*.sql", "**/*.java"]
    check: checks/check_nomenclatura_db.py
    descricao: Colunas de banco no formato <prefixo>_<tudojunto> (prefixos em rules/nomenclatura-db.json).
    como_corrigir: Renomear a coluna (migration e @Column/@JoinColumn) para o padrao.

  - id: EV-ARC-001
    severidade: CRITICO
    tipo: semantico
    descricao: Tenant nao via repository.central / centralTransactionManager, exceto catalogo/auth documentado.
    fonte: .cursor/rules/architecture.mdc

  - id: EV-ARC-002
    severidade: CRITICO
    tipo: semantico
    descricao: Catalogo/permissoes centrais nao so no EntityManager tenant.
    fonte: .cursor/rules/architecture.mdc

  - id: EV-ARC-003
    severidade: IMPORTANTE
    tipo: semantico
    descricao: Controller fino; negocio no service.
    fonte: .cursor/rules/architecture.mdc

  - id: EV-ARC-004
    severidade: IMPORTANTE
    tipo: semantico
    descricao: Mapper @Component; sem mapeamento pesado no controller.
    fonte: .cursor/rules/architecture.mdc

  - id: EV-ARC-005
    severidade: IMPORTANTE
    tipo: semi
    descricao: Pacotes dto.{dominio}, mapper, repository alinhados ao dominio.
    fonte: .cursor/rules/architecture.mdc

  - id: EV-ARC-006
    severidade: MELHORIA
    tipo: semi
    descricao: "@AllArgsConstructor ou construtor explicito."
    fonte: .cursor/rules/architecture.mdc

  - id: EV-CTL-001
